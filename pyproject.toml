[project]
name = "example-backend-profile"
requires-python = ">=3.12, <3.13"
version = "0.2.0"
dependencies = [
    "Django~=5.2",
    "django-cors-headers",
    "django-environ",
    "django-helusers",
    "djangorestframework",
    "helsinki-profile-gdpr-api",
    "social-auth-app-django",
]

[dependency-groups]
dev = [
    "ipython",
    "pytest-cov",
    "pytest-django",
]
prod = [
    "uwsgi",
]

[tool.uv]
package = false
exclude-newer = "P3D"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # pycodestyle
    "E",
    "W",
    # flake8-bandit
    "S",
    # flake8-boolean-trap
    "FBT",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-django
    "DJ",
    # flake8-gettext
    "INT",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
    # flake8-simplify
    "SIM",
    # pep8-naming
    "N",
    # pygrep-hooks
    "PGH",
    # isort
    "I001"
]
extend-per-file-ignores = { "*/migrations/*" = ["E501"], "*/tests/*" = ["E501", "S101"] }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_backend_profile.settings"
